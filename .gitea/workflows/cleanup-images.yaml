name: "Cleanup old Harbor images"

# ─────────────────────────────────────────────────────────────
# Queries ArgoCD to find which images are in use,
# then removes old versions from Harbor, keeping only:
#   1. The currently deployed version
#   2. The immediately previous version (emergency rollback)
# ─────────────────────────────────────────────────────────────
# Required secrets in Gitea:
#   ARGOCD_URL    ArgoCD URL
#   ARGOCD_USER   ArgoCD username
#   ARGOCD_PASS   ArgoCD password/token
#   HARBOR_URL    Harbor URL
#   HARBOR_USER   Harbor username
#   HARBOR_PASS   Harbor password/token
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 2 * * *"    # Daily at 02:00 UTC
  workflow_dispatch:       # Manual trigger from Gitea UI

jobs:
  cleanup:
    name: "Cleanup old Harbor images"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ops repository ────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. Install Python dependencies ───────────────────────
      - name: Install dependencies
        run: |
          pip install --quiet requests

      # ── 3. Run cleanup script ─────────────────────────────────
      - name: Run image cleanup
        env:
          ARGOCD_URL:            ${{ secrets.ARGOCD_URL }}
          ARGOCD_USER:           ${{ secrets.ARGOCD_USER }}
          ARGOCD_PASS:           ${{ secrets.ARGOCD_PASS }}
          HARBOR_URL:            ${{ secrets.HARBOR_URL }}
          HARBOR_USER:           ${{ secrets.HARBOR_USER }}
          HARBOR_PASS:           ${{ secrets.HARBOR_PASS }}
        run: |
          python3 .gitea/scripts/cleanup_images.py
