name: "Build, scan and push to Harbor"

# ─────────────────────────────────────────────────────────────
# Builds the Docker image, scans it with Trivy and
# pushes it to Harbor if no CRITICAL or HIGH vulnerabilities
# are found.
# ─────────────────────────────────────────────────────────────
# Required secrets in Gitea:
#   HARBOR_URL      Harbor URL (ej: harbor.cnie.internal)
#   HARBOR_USER     Harbor username
#   HARBOR_PASS     Harbor password/token
#   HARBOR_PROJECT  Harbor project name
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-scan-push:
    name: "Build, scan and push to Harbor"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v6

      # ── 2. Build Docker image ─────────────────────────────────
      - name: Build Docker image
        run: |
          IMAGE="${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/${{ gitea.event.repository.name }}"
          echo "IMAGE_BASE=${IMAGE}" >> $GITHUB_ENV

          docker build -t "${IMAGE}:${{ gitea.sha }}" -t "${IMAGE}:latest" .

          echo "Image built:"
          echo "  ${IMAGE}:${{ gitea.sha }}"
          echo "  ${IMAGE}:latest"

      # ── 3. Trivy scan ──────────────────────────────────────────
      - name: Trivy vulnerability scan
        run: |
          echo "Running vulnerability scan..."

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --format table \
              --no-progress \
              "${IMAGE_BASE}:${{ gitea.sha }}"

          echo "Scan passed: no CRITICAL or HIGH vulnerabilities found."

      # ── 4. Login to Harbor ────────────────────────────────────
      - name: Login to Harbor
        if: gitea.event_name == 'push'
        run: |
          echo "${{ secrets.HARBOR_PASS }}" | docker login \
            "${{ secrets.HARBOR_URL }}" \
            -u "${{ secrets.HARBOR_USER }}" \
            --password-stdin

      # ── 5. Push image to Harbor ───────────────────────────────
      - name: Push image to Harbor
        if: gitea.event_name == 'push'
        run: |
          docker push "${IMAGE_BASE}:${{ gitea.sha }}"
          docker push "${IMAGE_BASE}:latest"

          echo "Push completed:"
          echo "  ${IMAGE_BASE}:${{ gitea.sha }}"
          echo "  ${IMAGE_BASE}:latest"
