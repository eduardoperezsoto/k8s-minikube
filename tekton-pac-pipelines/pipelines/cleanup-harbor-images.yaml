apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cleanup-images
spec:
  description: >
    Cleans up Harbor images, keeping undeployed builds newer than the deployed
    version, the deployed version itself, and the previous one as rollback
    target. Deletes everything older. Runs daily via CronJob at 02:00 or manually.
    Set dry-run=true to preview deletions without removing anything.
  params:
    - name: dry-run
      type: string
      description: When "true", only logs what would be deleted without deleting.
      default: "false"
  tasks:
    - name: cleanup
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tekton-pac-pipelines
          - name: pathInRepo
            value: tasks/cleanup-harbor-images.yaml
      params:
        - name: dry-run
          value: $(params.dry-run)
