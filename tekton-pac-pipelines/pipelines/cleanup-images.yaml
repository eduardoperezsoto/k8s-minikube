apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cleanup-images
  namespace: ci #TBR
spec:
  description: >
    Cleans up Harbor images, keeping undeployed builds newer than the deployed
    version, the deployed version itself, and the previous one as rollback
    target. Deletes everything older. Runs daily via CronJob at 02:00 or manually.
  tasks:
    - name: cleanup
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tekton-pac-pipelines
          - name: pathInRepo
            value: tasks/cleanup-images.yaml
