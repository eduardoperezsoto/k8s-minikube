apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build
spec:
  description: >
    Builds a Docker image with Kaniko and saves it as image.tar on the source
    workspace.
  params:
    - name: image-name
      type: string
      description: "Full image ref without tag, e.g. harbor.harbor.svc.cluster.local:80/cnie-c0-apps/app"
    - name: tag
      type: string
      description: Image tag
    - name: dockerfile
      type: string
      description: Path to Dockerfile relative to the source workspace root
      default: Dockerfile
    - name: context
      type: string
      description: Build context path relative to the source workspace root
      default: "."
  workspaces:
    - name: source
      description: Workspace containing the cloned source; image.tar is written here
  steps:
    - name: build
      image: gcr.io/kaniko-project/executor:v1.24.0
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image-name):$(params.tag)
        - --no-push
        - --tarPath=$(workspaces.source.path)/image.tar
