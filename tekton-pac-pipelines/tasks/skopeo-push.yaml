apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: skopeo-push
spec:
  description: >
    Pushes the local image tarball to a container registry tagging it with both
    the provided tag and :latest.
  params:
    - name: image
      type: string
      description: "Full image ref without tag, e.g. harbor.harbor.svc.cluster.local:80/c0-apps/app"
    - name: tag
      type: string
      description: Image tag
  workspaces:
    - name: source
      description: Workspace containing image.tar
  steps:
    - name: push-and-tag
      image: quay.io/skopeo/stable:v1.22.2
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      script: |
        #!/bin/sh
        set -e
        echo "Pushing $(params.image):$(params.tag) from local tarball..."
        skopeo copy \
          --authfile "$HOME/.docker/config.json" \
          --src-tls-verify=false \
          --dest-tls-verify=false \
          docker-archive:$(workspaces.source.path)/image.tar \
          docker://$(params.image):$(params.tag)
        echo "Tagging $(params.image):$(params.tag) as :latest..."
        skopeo copy \
          --authfile "$HOME/.docker/config.json" \
          --src-tls-verify=false \
          --dest-tls-verify=false \
          docker://$(params.image):$(params.tag) \
          docker://$(params.image):latest
        echo "Done."