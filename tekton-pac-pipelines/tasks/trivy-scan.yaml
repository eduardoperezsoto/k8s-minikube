apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
spec:
  description: >
    Scans the local image tarball with Trivy. Fails if CRITICAL or HIGH
    vulnerabilities with an available fix are found. Unfixed CVEs are
    reported but do not gate the pipeline.
  params:
    - name: image
      type: string
      description: "Full image ref with tag — used only for display in logs"
  workspaces:
    - name: source
      description: Workspace containing image.tar
  steps:
    - name: scan
      image: aquasec/trivy:0.70.0
      computeResources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      script: |
        #!/bin/sh
        set -e
        echo "Scanning $(params.image) for CRITICAL,HIGH vulnerabilities..."
        trivy image \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --exit-code 1 \
          --format table \
          --no-progress \
          --input "$(workspaces.source.path)/image.tar"
        echo "Scan passed: no CRITICAL or HIGH vulnerabilities found."
