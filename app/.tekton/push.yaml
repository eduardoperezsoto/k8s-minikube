apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-scan-push
  annotations:
    # Triggered by Pipelines as Code on every push to main.
    # The Pipeline definition (with all Tasks) lives cluster-side in namespace ci
    # and is resolved via the cluster resolver. Bumps to the Pipeline are PRs
    # to the infra repo; app repos do not need changes.
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  timeouts:
    pipeline: "1h"
    tasks: "45m"
    finally: "10m"
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: build-scan-push
      - name: namespace
        value: ci
  params:
    # {{ repo_url }} resolves to Gitea's ROOT_URL (the external nip.io host), which
    # is not reachable from inside the cluster. Compose the in-cluster URL instead.
    - name: repo-url
      value: "http://gitea-http.gitea.svc.cluster.local:3000/ednel/{{ repo_name }}.git"
    - name: revision
      value: "{{ revision }}"
    - name: image-name
      value: "harbor.harbor.svc.cluster.local:80/ednel/{{ repo_name }}"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig
      secret:
        secretName: harbor-credentials
    - name: basic-auth
      secret:
        secretName: gitea-credentials
