# Credenciales de Gitea para git-clone (usadas por build-push-sa).
# Sellar con: kubeseal --cert sealed-secrets-pub.pem --format yaml < gitea-creds.yaml > ../gitea-creds-sealed-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gitea-creds
  namespace: cnie-pipelines-as-code
  annotations:
    tekton.dev/git-0: https://gitea.c0.cnie.internal
type: kubernetes.io/basic-auth
stringData:
  username: <gitea-user>
  password: <gitea-token>
