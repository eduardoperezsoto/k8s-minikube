# Build Push SA — used by build-scan-push PipelineRuns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-push-sa
  namespace: tekton-ci
secrets:
  - name: gitea-creds
  - name: harbor-dockerconfig

---

# Cleanup Images SA — used by cleanup-images PipelineRuns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-images-sa
  namespace: tekton-ci
imagePullSecrets:
  - name: harbor-dockerconfig

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-dashboard-role
  namespace: tekton-ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-dashboard-rolebinding
  namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-dashboard-role
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
