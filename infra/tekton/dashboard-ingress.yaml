apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  ingressClassName: apisix
  http:
    - name: tekton-dashboard
      match:
        hosts:
          - tekton.127.0.0.1.nip.io
        paths:
          - /*
      backends:
        - serviceName: tekton-dashboard
          servicePort: 9097
