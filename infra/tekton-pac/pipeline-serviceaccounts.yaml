# Build Push SA — used by build-scan-push PipelineRuns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-push-sa
  namespace: tekton-ci
secrets:
  - name: gitea-creds
  - name: harbor-dockerconfig

---

# Cleanup Images SA — used by cleanup-images PipelineRuns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-images-sa
  namespace: tekton-ci
imagePullSecrets:
  - name: harbor-dockerconfig
