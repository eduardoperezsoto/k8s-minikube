apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: ansible-playbooks
  namespace: cnie-pipelines-as-code
spec:
  url: http://gitea.127.0.0.1.nip.io:8080/cnie-c0-infra/ansible-playbooks #TBR
  git_provider:
    type: gitea
    url: http://gitea-http.gitea.svc.cluster.local:3000 #TBR
    secret:
      name: pac-gitea-secret
      key: provider.token
    webhook_secret:
      name: pac-gitea-secret
      key: webhook.secret
