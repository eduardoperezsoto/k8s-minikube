# Build Push SA — used by build-scan-push PipelineRuns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-push-sa
  namespace: cnie-pipelines-as-code
secrets:
  - name: gitea-creds
  - name: harbor-dockerconfig

---

# Cleanup Harbor Images SA — used by cleanup-images PipelineRuns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-harbor-images-sa
  namespace: cnie-pipelines-as-code
imagePullSecrets:
  - name: harbor-dockerconfig

---

# Ansible Run SA — used by Ansible playbook PipelineRuns (run-ansible-playbook).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-run-sa
  namespace: cnie-pipelines-as-code
secrets:
  - name: gitea-creds