apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-scheduler
  namespace: tekton-ci

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-scheduler
  namespace: tekton-ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-scheduler
  namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-scheduler
subjects:
  - kind: ServiceAccount
    name: cleanup-scheduler
    namespace: tekton-ci

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-image-cleanup
  namespace: tekton-ci
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cleanup-scheduler
          containers:
            - name: create-pipelinerun
              image: alpine/k8s:1.36.1
              command:
                - kubectl
                - create
                - -f
                - /manifests/pipelinerun.yaml
              volumeMounts:
                - name: manifest
                  mountPath: /manifests
          volumes:
            - name: manifest
              configMap:
                name: cleanup-pipelinerun-manifest
