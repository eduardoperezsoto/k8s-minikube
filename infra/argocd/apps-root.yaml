# App-of-apps root: instead of applying each child Application from disk, Argo
# reads them from the infra repo (argocd/apps/) and keeps them in sync. Adding a
# new app becomes a git commit; deleting its file de-registers it (prune).
# Kept OUTSIDE argocd/apps/ so the root does not try to manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/cnie-c0-infra/infra.git #TBR
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
