apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-pac-deployments
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/cnie-c0-infra/infra.git #TBR
    targetRevision: main
    path: tekton-pac-deployments
  destination:
    server: https://kubernetes.default.svc
    namespace: cnie-pipelines-as-code
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: pipelinesascode.tekton.dev
      kind: Repository
      jsonPointers:
        - /status
        - /pipelinerun_status
