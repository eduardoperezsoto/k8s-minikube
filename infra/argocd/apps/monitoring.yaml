apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.4.0
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          # Fixed admin credentials for the dev cluster: admin / admin
          # (matches the convention of gitea/harbor having known passwords).
          adminPassword: admin
          grafana.ini:
            server:
              # Grafana runs behind APISIX; make proxy exposes it on :8080
              root_url: http://grafana.127.0.0.1.nip.io:8080
          service:
            type: ClusterIP
        prometheus:
          prometheusSpec:
            retention: 2d
            # Pick up ServiceMonitors/PodMonitors from any namespace, not just
            # the ones the chart ships, so app metrics can be scraped later.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
        # Expose Grafana through APISIX, same convention as the rest of the stack.
        extraManifests:
          - apiVersion: apisix.apache.org/v2
            kind: ApisixRoute
            metadata:
              name: grafana
              namespace: monitoring
            spec:
              ingressClassName: apisix
              http:
                - name: grafana
                  match:
                    hosts:
                      - grafana.127.0.0.1.nip.io
                    paths:
                      - /*
                  backends:
                    - serviceName: monitoring-grafana
                      servicePort: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack CRDs exceed the client-side apply annotation
      # size limit; server-side apply is required for the sync to succeed.
      - ServerSideApply=true
