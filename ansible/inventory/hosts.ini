# Inventario de nodos Kubernetes por cluster.
# Rellena los hostnames/IPs reales y el usuario SSH de cada nodo.
#
# Estructura de grupos:
#   c0 / c1            -> agregan control-plane + workers de cada cluster
#   kube_nodes         -> todos los nodos de todos los clusters
#
# Usa --limit para acotar:  ansible-playbook install-ca.yml --limit c1_workers

[c0_control_plane]
# c0-cp-1 ansible_host=10.0.0.11

[c0_workers]
# c0-wk-1 ansible_host=10.0.0.21
# c0-wk-2 ansible_host=10.0.0.22

[c1_control_plane]
# c1-cp-1 ansible_host=10.1.0.11

[c1_workers]
# c1-wk-1 ansible_host=10.1.0.21
# c1-wk-2 ansible_host=10.1.0.22

[c0:children]
c0_control_plane
c0_workers

[c1:children]
c1_control_plane
c1_workers

[kube_nodes:children]
c0
c1

[kube_nodes:vars]
# Usuario SSH con permisos sudo en los nodos.
ansible_user = ansible
# Si usas clave dedicada:
# ansible_ssh_private_key_file = ~/.ssh/id_ednel_nodes
