apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-ci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ednel/infra.git
    targetRevision: main
    path: tekton
  destination:
    server: https://kubernetes.default.svc
    namespace: ci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: tekton.dev
      kind: Pipeline
      jsonPointers:
        - /status
    - group: tekton.dev
      kind: Task
      jsonPointers:
        - /status
      jqPathExpressions:
        - .spec.steps[].computeResources
    - group: triggers.tekton.dev
      kind: EventListener
      jsonPointers:
        - /status
