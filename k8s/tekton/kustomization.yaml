apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - dashboard-ingress.yaml
  - git-resolver-config.yaml
  - pac/repository.yaml
  - pac/networkpolicy.yaml
  - cleanup/cronjob.yaml
  - cleanup/pipelinerun-pruner.yaml

configMapGenerator:
  - name: cleanup-script
    namespace: ci
    files:
      - cleanup_images.py=cleanup/cleanup_images.py
    options:
      disableNameSuffixHash: true
