apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - dashboard-ingress.yaml
  - tasks/git-clone.yaml
  - tasks/kaniko-build.yaml
  - tasks/trivy-scan.yaml
  - tasks/skopeo-push.yaml
  - tasks/cleanup-images.yaml
  - pipelines/build-scan-push.yaml
  - pipelines/cleanup-images.yaml
  - pac/repository.yaml
  - pac/ingress.yaml
  - pac/networkpolicy.yaml
  - cleanup/cronjob.yaml
  - cleanup/pipelinerun-pruner.yaml

configMapGenerator:
  - name: cleanup-script
    namespace: ci
    files:
      - cleanup_images.py=cleanup/cleanup_images.py
    options:
      disableNameSuffixHash: true
