apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-scan-push
  namespace: ci
spec:
  description: >
    Builds the Docker image, scans it with Trivy, and pushes to Harbor only if
    no CRITICAL or HIGH vulnerabilities are found. Generic across projects:
    referenced from each app repo's .tekton/push.yaml via cluster resolver.
  params:
    - name: repo-url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      description: Git commit SHA to build
    - name: image-name
      type: string
      description: "Full image ref without tag, e.g. harbor.../ednel/app"
    - name: dockerfile
      type: string
      description: Path to Dockerfile relative to the source workspace root
      default: Dockerfile
    - name: context
      type: string
      description: Build context path relative to the source workspace root
      default: "."

  workspaces:
    - name: source
    - name: dockerconfig
    - name: basic-auth

  tasks:
    - name: git-clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: ci
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: build
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: kaniko-build
          - name: namespace
            value: ci
      runAfter: [git-clone]
      params:
        - name: image
          value: $(params.image-name)
        - name: tag
          value: $(params.revision)
        - name: dockerfile
          value: $(params.dockerfile)
        - name: context
          value: $(params.context)
      workspaces:
        - name: source
          workspace: source

    - name: trivy-scan
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: trivy-scan
          - name: namespace
            value: ci
      runAfter: [build]
      params:
        - name: image
          value: $(params.image-name):$(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: skopeo-push
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: skopeo-push
          - name: namespace
            value: ci
      runAfter: [trivy-scan]
      params:
        - name: image
          value: $(params.image-name)
        - name: tag
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
