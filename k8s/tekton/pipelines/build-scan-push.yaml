apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-scan-push
  namespace: ci
spec:
  description: >
    Builds the Docker image, scans it with Trivy, and pushes to Harbor only if
    no CRITICAL or HIGH vulnerabilities are found. Generic across projects:
    referenced from each app repo's .tekton/push.yaml via git resolver.
  params:
    - name: repo-owner
      type: string
      description: Git org/owner that holds the source repo
    - name: repo-name
      type: string
      description: Source repo name (also used as Harbor image name)
    - name: revision
      type: string
      description: Git commit SHA to build
    - name: gitea-base
      type: string
      description: In-cluster base URL of Gitea (override per cluster)
      default: "http://gitea-http.gitea.svc.cluster.local:3000"
    - name: harbor-base
      type: string
      description: In-cluster base URL of Harbor registry (override per cluster)
      default: "harbor.harbor.svc.cluster.local:80"
    - name: dockerfile
      type: string
      description: Path to Dockerfile relative to the source workspace root
      default: Dockerfile
    - name: context
      type: string
      description: Build context path relative to the source workspace root
      default: "."

  workspaces:
    - name: source
    - name: dockerconfig
    - name: basic-auth

  tasks:
    - name: git-clone
      taskRef:
        resolver: git
        params:
          - name: repo
            value: infra
          - name: pathInRepo
            value: tekton/tasks/git-clone.yaml
      params:
        - name: url
          value: "$(params.gitea-base)/$(params.repo-owner)/$(params.repo-name).git"
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: kaniko-build
      taskRef:
        resolver: git
        params:
          - name: repo
            value: infra
          - name: pathInRepo
            value: tekton/tasks/kaniko-build.yaml
      runAfter: [git-clone]
      params:
        - name: image
          value: "$(params.harbor-base)/$(params.repo-owner)/$(params.repo-name)"
        - name: tag
          value: $(params.revision)
        - name: dockerfile
          value: $(params.dockerfile)
        - name: context
          value: $(params.context)
      workspaces:
        - name: source
          workspace: source

    - name: trivy-scan
      taskRef:
        resolver: git
        params:
          - name: repo
            value: infra
          - name: pathInRepo
            value: tekton/tasks/trivy-scan.yaml
      runAfter: [kaniko-build]
      params:
        - name: image
          value: "$(params.harbor-base)/$(params.repo-owner)/$(params.repo-name):$(params.revision)"
      workspaces:
        - name: source
          workspace: source

    - name: skopeo-push
      taskRef:
        resolver: git
        params:
          - name: repo
            value: infra
          - name: pathInRepo
            value: tekton/tasks/skopeo-push.yaml
      runAfter: [trivy-scan]
      params:
        - name: image
          value: "$(params.harbor-base)/$(params.repo-owner)/$(params.repo-name)"
        - name: tag
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
