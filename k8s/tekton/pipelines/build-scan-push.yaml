apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-scan-push
  namespace: ci
spec:
  description: >
    Builds the Docker image, scans it with Trivy, and promotes it to latest
    only if no CRITICAL or HIGH vulnerabilities are found.
  params:
    - name: repo-url
      type: string
      description: Gitea URL
    - name: revision
      type: string
      description: Git commit SHA
    - name: image-name
      type: string
      description: "Full image ref without tag, e.g. harbor.cnie.internal/project/app"

  workspaces:
    - name: source
      description: Shared workspace for the cloned source code
    - name: dockerconfig
      description: Docker registry authentication for Harbor
    - name: basic-auth
      description: Git credentials for Gitea

  tasks:
    # ── 1. Clone repository ──────────────────────────────────────────────
    - name: git-clone
      taskRef:
        kind: Task
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    # ── 2. Build image to local tarball  ──────
    - name: build
      taskRef:
        kind: Task
        name: kaniko-build
      runAfter: [git-clone]
      params:
        - name: image
          value: $(params.image-name)
        - name: tag
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    # ── 3. Scan image  ────
    - name: trivy-scan
      taskRef:
        kind: Task
        name: trivy-scan
      runAfter: [build]
      params:
        - name: image
          value: $(params.image-name):$(params.revision)
      workspaces:
        - name: source
          workspace: source

    # ── 4. Push image to Harbor ─
    - name: skopeo-push
      taskRef:
        kind: Task
        name: skopeo-push
      runAfter: [trivy-scan]
      params:
        - name: image
          value: $(params.image-name)
        - name: tag
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
