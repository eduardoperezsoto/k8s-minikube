# Exposes the Pipelines as Code controller so Gitea can deliver webhooks.
# Configure in Gitea: Settings → Webhooks → Add Webhook → Gitea
#   URL:          http://pac.127.0.0.1.nip.io:8080/
#   Content type: application/json
#   Trigger:      Push events
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipelines-as-code
  namespace: pipelines-as-code
spec:
  ingressClassName: apisix
  rules:
    - host: pac.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipelines-as-code-controller
                port:
                  number: 8080
