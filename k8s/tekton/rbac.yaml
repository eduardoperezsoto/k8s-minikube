# harbor-credentials plays two roles thanks to its dockerconfigjson type:
# Tekton's credential initializer mounts it (via the tekton.dev/docker-0
# annotation on the Secret) so Tasks can auth against Harbor; kubelet uses it
# as imagePullSecret to pull Task images from Harbor's private project.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipeline-sa
  namespace: ci
secrets:
  - name: harbor-credentials
imagePullSecrets:
  - name: harbor-credentials

# tekton-pipeline-sa intentionally has no Role/RoleBinding: Tasks don't call
# the K8s API. If a future Task needs it, define a scoped Role for that Task.

---
# Tekton Dashboard already has cluster-wide read on Tekton CRDs and pod logs
# via tekton-aggregate-view. This Role only adds the write verbs needed from
# the UI (create/cancel/delete PipelineRuns). Pipeline/Task definitions remain
# GitOps-managed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-dashboard-role
  namespace: ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-dashboard-rolebinding
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-dashboard-role
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
