# ServiceAccount used by PipelineRuns and the cleanup CronJob.
# - secrets: harbor-credentials is picked up by Tekton's credential initializer
#   (via the tekton.dev/docker-0 annotation on the Secret) and injected into
#   Task containers so skopeo/kaniko can auth against Harbor.
# - imagePullSecrets: kubelet uses the same Secret (type dockerconfigjson) to
#   pull container images from Harbor's private project, e.g. harbor-cleanup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipeline-sa
  namespace: ci
secrets:
  - name: harbor-credentials
imagePullSecrets:
  - name: harbor-credentials

---
# Allow the SA to create/read TaskRuns and PipelineRuns in the ci namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-pipeline-role
  namespace: ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipeline-rolebinding
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-pipeline-role
subjects:
  - kind: ServiceAccount
    name: tekton-pipeline-sa
    namespace: ci

---
# Allow the Tekton Dashboard to create/manage PipelineRuns in the ci namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-dashboard-rolebinding
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-pipeline-role
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
