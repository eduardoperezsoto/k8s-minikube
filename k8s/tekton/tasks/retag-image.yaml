apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: retag-image
  namespace: ci
spec:
  description: >
    Adds the :latest tag to an image already in Harbor using crane.
    Runs only after Trivy scan passes, so :latest always points to a
    vulnerability-free image.
  params:
    - name: image
      description: "Full image ref without tag, e.g. harbor.harbor.svc.cluster.local:80/ednel/app"
    - name: source-tag
      description: Existing tag to promote (commit SHA)
    - name: target-tag
      description: Tag to add
      default: latest
  steps:
    - name: retag
      image: gcr.io/go-containerregistry/crane:latest
      env:
        - name: HARBOR_USER
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: username
              optional: true
        - name: HARBOR_PASS
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: password
              optional: true
      script: |
        #!/busybox/sh
        set -e
        SOURCE="$(params.image):$(params.source-tag)"
        TARGET="$(params.image):$(params.target-tag)"

        if [ -n "${HARBOR_USER}" ]; then
          crane auth login \
            "$(echo '$(params.image)' | cut -d/ -f1)" \
            -u "${HARBOR_USER}" -p "${HARBOR_PASS}" \
            --insecure
        fi

        echo "Retagging ${SOURCE} → ${TARGET}"
        crane tag "${SOURCE}" "$(params.target-tag)" --insecure
        echo "Done."
