apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: retag-image
  namespace: ci
spec:
  description: >
    Adds the :latest tag to an image already in Harbor using crane.
    Runs only after Trivy scan passes, so :latest always points to a
    vulnerability-free image.
  params:
    - name: image
      type: string
      description: "Full image ref without tag, e.g. harbor.harbor.svc.cluster.local:80/ednel/app"
    - name: source-tag
      type: string
      description: Existing tag to promote (commit SHA)
    - name: target-tag
      type: string
      description: Tag to add
      default: latest
  workspaces:
    - name: dockerconfig
      description: Docker config.json for Harbor authentication
      mountPath: /workspace/dockerconfig
  steps:
    - name: retag
      image: gcr.io/go-containerregistry/crane:latest
      env:
        - name: DOCKER_CONFIG
          value: /workspace/dockerconfig
      command:
        - /ko-app/crane
      args:
        - tag
        - $(params.image):$(params.source-tag)
        - $(params.target-tag)
        - --insecure
