apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-images
  namespace: ci
spec:
  description: >
    Cleans up Harbor images, keeping undeployed builds newer than the deployed
    version, the deployed version itself, and the previous one as rollback
    target. Deletes everything older.
  steps:
    - name: cleanup
      image: harbor.harbor.svc.cluster.local:80/ednel/harbor-cleanup:latest
      command: ["python3", "/scripts/cleanup_images.py"]
      env:
        - name: ARGOCD_URL
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: argocd-url
        - name: ARGOCD_USER
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: argocd-user
        - name: ARGOCD_PASS
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: argocd-pass
        - name: HARBOR_URL
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: harbor-url
        - name: HARBOR_USER
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: harbor-user
        - name: HARBOR_PASS
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: harbor-pass
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: cleanup-script
        defaultMode: 0755
