apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: skopeo-push
  namespace: ci
spec:
  description: >
    Pushes the local image tarball to Harbor tagging it with both the commit
    SHA and :latest in a single operation. Runs only after Trivy scan passes,
    so the registry never receives a vulnerable image.
  params:
    - name: image
      type: string
      description: "Full image ref without tag, e.g. harbor.harbor.svc.cluster.local:80/ednel/app"
    - name: tag
      type: string
      description: Image tag (commit SHA)
  workspaces:
    - name: source
      description: Workspace containing image.tar
    - name: dockerconfig
      description: Docker registry authentication for Harbor
      mountPath: /workspace/dockerconfig
  steps:
    - name: push-and-tag
      image: quay.io/skopeo/stable:v1.22.2
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      script: |
        #!/bin/sh
        set -e
        # Immutable tag (commit SHA)
        skopeo copy \
          --authfile=$(workspaces.dockerconfig.path)/config.json \
          --src-tls-verify=false \
          --dest-tls-verify=false \
          docker-archive:$(workspaces.source.path)/image.tar \
          docker://$(params.image):$(params.tag)
        # Mutable tag (latest) — reuses blobs from previous push by digest
        skopeo copy \
          --authfile=$(workspaces.dockerconfig.path)/config.json \
          --src-tls-verify=false \
          --dest-tls-verify=false \
          docker://$(params.image):$(params.tag) \
          docker://$(params.image):latest