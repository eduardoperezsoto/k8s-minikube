# Harbor push credentials for Kaniko and crane.
# The tekton.dev annotation tells the credential initializer sidecar which
# registry this secret covers, so it is automatically mounted into Tasks.
#
# To regenerate with real values:
#   kubectl create secret docker-registry harbor-credentials \
#     --docker-server=harbor.harbor.svc.cluster.local:80 \
#     --docker-username=admin \
#     --docker-password=Harbor12345 \
#     -n ci --dry-run=client -o yaml \
#   | kubectl annotate --local -f - tekton.dev/docker-0=harbor.harbor.svc.cluster.local:80 -o yaml \
#   | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: harbor-credentials
  namespace: ci
  annotations:
    tekton.dev/docker-0: harbor.harbor.svc.cluster.local:80
type: kubernetes.io/dockerconfigjson
data:
  # {"auths":{"harbor.harbor.svc.cluster.local:80":{"auth":"<base64(admin:Harbor12345)>"}}}
  .dockerconfigjson: eyJhdXRocyI6eyJoYXJib3IuaGFyYm9yLnN2Yy5jbHVzdGVyLmxvY2FsOjgwIjp7ImF1dGgiOiJZV1J0YVc0NlNHRnlZbTl5TVRJek5EVT0ifX19
