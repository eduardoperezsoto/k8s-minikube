# Exposes the Tekton EventListener so Gitea can reach it via webhook.
# The EventListener Service is named el-<listener-name> by the controller,
# so: el-gitea-listener.
#
# Configure in Gitea: Settings → Webhooks → Add Webhook → Gitea
#   URL:         http://tekton-listener.127.0.0.1.nip.io:8080/
#   Content type: application/json
#   Trigger:      Push events
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-event-listener
  namespace: ci
spec:
  ingressClassName: apisix
  rules:
    - host: tekton-listener.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: el-gitea-listener
                port:
                  number: 8080
