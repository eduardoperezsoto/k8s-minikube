apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: gitea-listener
  namespace: ci
spec:
  namespaceSelector: {}
  resources: {}
  serviceAccountName: tekton-triggers-sa
  triggers:
    # ── Project: ednel (owner: admin) ────────────────────────────
    # To add a new project, copy this trigger block, change the
    # owner.login filter and the harbor_project expression value.
    - name: ednel-push
      interceptors:
        - ref:
            kind: ClusterInterceptor
            name: cel
          params:
            - name: filter
              value: >
                (body.ref == 'refs/heads/main' ||
                 body.ref == 'refs/heads/master') &&
                body.repository.owner.login == 'admin'
            - name: overlays
              value:
                - key: truncated_sha
                  expression: "body.after.truncate(8)"
                - key: harbor_project
                  expression: "'ednel'"
      bindings:
        - kind: TriggerBinding
          ref: gitea-push-binding
      template:
        ref: build-scan-push-template
