# Credentials for the cleanup CronJob.
# Populate before applying (replace <base64-value> with real encoded values):
#
#   kubectl create secret generic cleanup-credentials \
#     --from-literal=argocd-url=http://argocd-server.argocd.svc.cluster.local \
#     --from-literal=argocd-user=admin \
#     --from-literal=argocd-pass=<password> \
#     --from-literal=harbor-url=http://harbor.harbor.svc.cluster.local:80 \
#     --from-literal=harbor-user=admin \
#     --from-literal=harbor-pass=Harbor12345 \
#     -n ci --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: cleanup-credentials
  namespace: ci
type: Opaque
stringData:
  argocd-url: "http://argocd-server.argocd.svc.cluster.local"
  argocd-user: "admin"
  argocd-pass: "REPLACE_ME"
  harbor-url: "http://harbor.harbor.svc.cluster.local:80"
  harbor-user: "admin"
  harbor-pass: "Harbor12345"
