apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-scheduler
  namespace: ci

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-scheduler
  namespace: ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-scheduler
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-scheduler
subjects:
  - kind: ServiceAccount
    name: cleanup-scheduler
    namespace: ci

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-image-cleanup
  namespace: ci
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cleanup-scheduler
          containers:
            - name: create-pipelinerun
              image: alpine/k8s:1.36.1
              command:
                - /bin/sh
                - -c
                - |
                  kubectl create -f - <<'EOF'
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: cleanup-images-
                    namespace: ci
                  spec:
                    pipelineRef:
                      name: cleanup-images
                    taskRunTemplate:
                      serviceAccountName: tekton-pipeline-sa
                  EOF
