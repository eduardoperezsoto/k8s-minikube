# Test inventory for the local minikube cluster (docker driver, single node).
#
# Use it to validate install-ca.yml against the minikube node before migrating
# to prod. In prod, point the pipeline at inventory/hosts.ini instead.
#
#   ansible-playbook -i inventory/minikube.ini install-ca.yml
#
# The minikube node runs sshd: user 'docker', key at
# ~/.minikube/machines/minikube/id_rsa. The ephemeral Tekton pod has no
# known_hosts, so host key checking is disabled here (test only).

[kube_nodes]
minikube ansible_host=192.168.49.2 ansible_user=docker

[kube_nodes:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
